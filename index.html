<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="StaffPulse - sistema de cadastro e gestão de colaboradores"
    />
    <title>StaffPulse</title>
    <link rel="stylesheet" href="./src/css/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <a class="brand" href="./" aria-label="Página inicial do StaffPulse">
          StaffPulse
        </a>
      </header>

      <main id="app" class="app-main">
        <section class="welcome" aria-labelledby="welcome-title">
          <p class="eyebrow">Sistema de gestão de pessoas</p>
          <h1 id="welcome-title">Bem-vindo ao StaffPulse</h1>
          <p>
            Estrutura inicial pronta para o cadastro e gerenciamento de colaboradores.
          </p>
          <div id="employee-count" class="employee-count" aria-live="polite">
            Nenhum colaborador cadastrado.
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./src/js/app.js"></script>
  </body>
</html>
